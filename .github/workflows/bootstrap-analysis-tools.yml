name: Bootstrap Analysis Tools

on:
  push:
    paths:
      - '.github/workflows/bootstrap-analysis-tools.yml'
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download analysis tools
        run: |
          set -euxo pipefail
          mkdir -p tools
          curl -L --fail --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d tools/jadx
          curl -L --fail --retry 3 \
            https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip \
            -o /tmp/dex2jar.zip
          unzip -q /tmp/dex2jar.zip -d tools/dex2jar
          chmod +x tools/jadx/bin/jadx tools/dex2jar/*.sh || true
          tools/jadx/bin/jadx --version
          find tools/dex2jar -name 'd2j-dex2jar.sh' -exec {} --help \; | head -10
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-analysis-tools
          path: tools
          if-no-files-found: error
          retention-days: 7
