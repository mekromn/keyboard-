name: Bootstrap Android Platform

on:
  push:
    paths:
      - '.github/workflows/bootstrap-android-platform.yml'
  workflow_dispatch:

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - name: Locate or install platform
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ ! -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
          mkdir -p out
          cp "$ANDROID_SDK_ROOT/platforms/android-36/android.jar" out/android-36.jar
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-android-platform
          path: out/android-36.jar
          retention-days: 7
