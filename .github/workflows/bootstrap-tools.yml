name: Bootstrap Android Tools

on:
  push:
    paths:
      - '.github/workflows/bootstrap-tools.yml'
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download Apktool
        run: |
          set -euxo pipefail
          mkdir -p tools/apktool tools/build-tools
          curl -L --fail --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o tools/apktool/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool/apktool.jar' | sha256sum -c -
      - name: Copy Android build tools
        run: |
          set -euxo pipefail
          BT="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using $BT"
          cp "$BT/apksigner" tools/build-tools/
          cp "$BT/zipalign" tools/build-tools/
          cp "$BT/aapt2" tools/build-tools/
          cp -a "$BT/lib" tools/build-tools/
          chmod +x tools/build-tools/apksigner tools/build-tools/zipalign tools/build-tools/aapt2
          java -version
          tools/build-tools/apksigner version
          tools/build-tools/zipalign -h >/dev/null 2>&1 || true
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-android-tools
          path: tools
          if-no-files-found: error
          retention-days: 7
